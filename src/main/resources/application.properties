# Spring Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
spring.application.name=vollmed-api
server.error.include-stacktrace=never

# JWT Configuration
api.security.token.secret=${JWT_SECRET:12345678}

# Enable Problem Details for Spring MVC
spring.mvc.problemdetails.enabled=true

# Actuator Configuration
# management.endpoints.web.exposure.include=health,info,prometheus,metrics
# management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=vollmed-api
management.observations.key-value.application=vollmed-api