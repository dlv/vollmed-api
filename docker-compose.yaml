version: '3'
services:
  mysqldb:
    image: mysql:8.0.36
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-vollmed_db}
      - MYSQL_USER=${MYSQL_USER:-vollmed_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-vollmed_password}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - vollmed
  
  api:
    build: .
    container_name: vollmed
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-vollmed_db}?createDatabaseIfNotExist=true
      MYSQL_USER: ${MYSQL_USER:-vollmed_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vollmed_password}
    depends_on: 
      - mysqldb
    ports:
      - "8000:8080"
    networks:
      - vollmed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - vollmed

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - vollmed
    depends_on:
      - prometheus

networks:
  vollmed:
    driver: bridge

volumes:
  mysql-data: