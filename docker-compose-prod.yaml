services:
  mysqldb:
    image: mysql:8.0.36
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-vollmed_db}
      - MYSQL_USER=${MYSQL_USER:-vollmed_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-vollmed_password}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - vollmed
  
  api:
    image: vollmed-api_api:latest   
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-vollmed_db}?createDatabaseIfNotExist=true
    depends_on: 
      - mysqldb
    ports:
      - "8000:8080"
    networks:
      - vollmed

networks:
  vollmed:
    driver: bridge

volumes:
  mysql-data:
